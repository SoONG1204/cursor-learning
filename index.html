<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人介绍</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>我的个人主页</h1>
    <p>正在学习前端开发的初学者</p>
  </header>

  <main>

    <section id="about">
      <h2>关于我</h2>
      <p>
        你好，我是 你的名字。目前正在学习 HTML 和 CSS，
        希望通过这个项目练习如何搭建一个个人介绍页面。v2
      </p>
      <p>
        我对编程充满好奇，喜欢把想法变成可以在浏览器里看到的网页。
        虽然还在入门阶段，但我会一步一步把基础打扎实。
      </p>
    </section>

    <section id="skills">
      <h2>技能</h2>
      <button type="button" id="toggle-skills">显示技能</button>
      <ul id="skills-list" class="hidden">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
    </section>

    <section id="contact">
      <h2>联系方式</h2>
      <p>邮箱：<a href="mailto:your.email@example.com">your.email@example.com</a></p>
      <p>GitHub：<a href="https://github.com/yourname" target="_blank">github.com/yourname</a></p>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 你的名字</p>
  </footer>

  <script src="main.js"></script>

</body>
</html>
